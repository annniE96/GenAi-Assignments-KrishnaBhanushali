version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    ECR_REPOSITORY: bedrock-agentcore-krishi

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - echo Current directory is $(pwd)
      - SOURCE_DIR=$(dirname "$(find . -name Dockerfile -print -quit)")
      - if [ -z "$SOURCE_DIR" ] || [ "$SOURCE_DIR" = "." ]; then SOURCE_DIR=. ; fi
      - cd "$SOURCE_DIR"
      - echo Using source directory $(pwd)
      - "echo Files in source directory:"
      - ls -la
      - test -f Dockerfile
      - test -f multiagent.py
      - test -f requirements.txt
      - test -d uat_documents
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}
      - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG=latest; fi
  build:
    commands:
      - echo Building the Docker image...
      - docker build -t ${ECR_REPOSITORY}:${IMAGE_TAG} .
      - docker tag ${ECR_REPOSITORY}:${IMAGE_TAG} ${ECR_URI}:${IMAGE_TAG}
      - docker tag ${ECR_REPOSITORY}:${IMAGE_TAG} ${ECR_URI}:latest
  post_build:
    commands:
      - echo Pushing the Docker image...
      - docker push ${ECR_URI}:${IMAGE_TAG}
      - docker push ${ECR_URI}:latest
      - printf '{"imageUri":"%s"}\n' ${ECR_URI}:latest > imageDetail.json
artifacts:
  files:
    - imageDetail.json
    - ecs-task-definition.json
    - ecs-service.json
    - AGENTCORE.md