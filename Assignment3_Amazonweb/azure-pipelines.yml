trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(pythonVersion)'
      addToPath: true
    displayName: 'Use Python $(pythonVersion)'

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install dependencies'

  - script: |
      playwright install --with-deps chromium
    displayName: 'Install Playwright browser'

  # Run Pytest and output a JUnit XML report
  - script: |
      pytest tests/ --junitxml=test-results.xml --html=report.html --self-contained-html
    displayName: 'Run Playwright Automated Tests'
    condition: succeededOrFailed()

  # Publish test results to the Azure DevOps Pipeline Test Dashboard
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/test-results.xml'
      failTaskOnFailedTests: true
    displayName: 'Publish Test Results'
    condition: always()

  # Upload failure screenshots or HTML reports as pipeline artifacts
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(System.DefaultWorkingDirectory)/report.html'
      artifact: 'PlaywrightTestReport'
      publishLocation: 'pipeline'
    displayName: 'Publish Test Execution Report'
    condition: always()
